<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Darslar">
<title>Darslar</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#000;--surface:#1c1c1e;--surface2:#2c2c2e;
  --border:#38383a;--text:#fff;--muted:#8e8e93;
  --green:#30d158;--orange:#ff9f0a;--blue:#0a84ff;--red:#ff453a;--purple:#bf5af2;
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',-apple-system,sans-serif;min-height:100vh;max-width:430px;margin:0 auto;padding-bottom:60px;}

.header{padding:52px 20px 6px;display:flex;justify-content:space-between;align-items:flex-end;}
.header-title{font-size:2rem;font-weight:800;letter-spacing:-0.5px;}
.header-right{display:flex;align-items:center;gap:8px;}
.clock{font-size:0.85rem;color:var(--muted);}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:none;color:var(--orange);font-size:1.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s;}
.add-btn:active{transform:scale(0.88);}
.sound-btn{width:32px;height:32px;border-radius:50%;background:var(--surface2);border:none;color:var(--blue);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}

.nav-tabs{display:flex;padding:14px 20px 6px;border-bottom:1px solid var(--border);}
.nav-tab{flex:1;padding:8px 4px;font-size:0.78rem;font-weight:700;border:none;background:transparent;color:var(--muted);cursor:pointer;font-family:'Nunito',sans-serif;border-bottom:2px solid transparent;transition:all 0.18s;}
.nav-tab.active{color:var(--orange);border-bottom-color:var(--orange);}

.day-tabs{display:flex;gap:7px;padding:10px 20px;overflow-x:auto;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:6px 13px;border-radius:20px;font-size:0.82rem;font-weight:600;border:none;cursor:pointer;background:var(--surface);color:var(--muted);transition:all 0.18s;font-family:'Nunito',sans-serif;}
.day-tab.active{background:var(--orange);color:#000;}
.day-tab.has-l{color:var(--text);}

.sec-label{padding:10px 20px 5px;font-size:0.72rem;font-weight:700;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;}
.lesson-list{padding:0 16px;}
.lesson-row{display:flex;align-items:center;padding:13px 14px;background:var(--surface);border-radius:4px;margin-bottom:2px;gap:12px;position:relative;overflow:hidden;transition:opacity 0.25s;}
.lesson-row:first-child{border-radius:14px 14px 4px 4px;}
.lesson-row:last-child{border-radius:4px 4px 14px 14px;}
.lesson-row:only-child{border-radius:14px;}
.lesson-row.done{opacity:0.4;}
.lesson-row::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;opacity:0;transition:opacity 0.3s;background:var(--blue);}
.lesson-row.soon::before{background:var(--orange);opacity:1;}
.lesson-row.done::before{background:var(--green);opacity:1;}
.lesson-row.skipped::before{background:var(--red);opacity:0.6;}

.lesson-time{font-size:1.35rem;font-weight:300;letter-spacing:-1px;min-width:52px;}
.lesson-row.done .lesson-time,.lesson-row.skipped .lesson-time{color:var(--muted);}
.lesson-info{flex:1;min-width:0;}
.lesson-name{font-size:1rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lesson-row.done .lesson-name{text-decoration:line-through;color:var(--muted);}
.lesson-sub{font-size:0.72rem;color:var(--muted);margin-top:1px;}
.lesson-sub.sc{color:var(--orange);}
.week-badge{font-size:0.62rem;padding:2px 7px;border-radius:8px;background:rgba(10,132,255,0.15);color:var(--blue);font-weight:700;margin-left:6px;}

.row-actions{display:flex;align-items:center;gap:6px;}
.edit-btn{width:26px;height:26px;border-radius:50%;background:rgba(10,132,255,0.13);border:none;color:var(--blue);font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.toggle-wrap{display:flex;flex-direction:column;align-items:center;gap:2px;}
.toggle{width:51px;height:31px;border-radius:16px;background:var(--surface2);position:relative;cursor:pointer;transition:background 0.25s;border:none;}
.toggle.on{background:var(--green);}
.toggle-knob{position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.4);transition:transform 0.25s cubic-bezier(.4,0,.2,1);pointer-events:none;}
.toggle.on .toggle-knob{transform:translateX(20px);}
.toggle-lbl{font-size:0.6rem;font-weight:700;color:var(--muted);}
.toggle.on~.toggle-lbl{color:var(--green);}
.del-btn{width:26px;height:26px;border-radius:50%;background:rgba(255,69,58,0.13);border:none;color:var(--red);font-size:0.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;}
.lesson-row:hover .del-btn,.lesson-row.show-del .del-btn{opacity:1;}

.empty-state{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:2.4rem;margin-bottom:10px;}

/* SOUND SETTINGS */
.sound-page{padding:16px;}
.sound-title{font-size:1.1rem;font-weight:700;margin-bottom:4px;}
.sound-sub{font-size:0.82rem;color:var(--muted);margin-bottom:20px;}
.sound-list{display:flex;flex-direction:column;gap:8px;}
.sound-item{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:14px 16px;border:2px solid transparent;transition:all 0.2s;cursor:pointer;}
.sound-item.selected{border-color:var(--orange);}
.sound-left{display:flex;align-items:center;gap:12px;}
.sound-icon{font-size:1.4rem;}
.sound-name{font-size:0.95rem;font-weight:600;}
.sound-desc{font-size:0.75rem;color:var(--muted);margin-top:2px;}
.play-btn{width:34px;height:34px;border-radius:50%;background:var(--surface2);border:none;color:var(--orange);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.play-btn:active{transform:scale(0.9);}
.selected-badge{font-size:0.7rem;padding:3px 10px;border-radius:10px;background:rgba(255,159,10,0.15);color:var(--orange);font-weight:700;}

.vol-section{background:var(--surface);border-radius:14px;padding:16px;margin-top:16px;}
.vol-title{font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:12px;}
.vol-row{display:flex;align-items:center;gap:12px;}
.vol-icon{font-size:1.1rem;}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:var(--surface2);outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--orange);cursor:pointer;}
.vol-val{font-size:0.82rem;color:var(--muted);min-width:30px;text-align:right;}

/* STATS */
.stats-page{padding:0 16px 16px;}
.month-selector{display:flex;align-items:center;justify-content:space-between;padding:10px 0;margin-bottom:8px;}
.month-nav{background:var(--surface2);border:none;color:var(--text);width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.month-label{font-size:0.95rem;font-weight:700;}
.summary-row{display:flex;gap:8px;margin-bottom:12px;}
.sum-card{flex:1;background:var(--surface);border-radius:14px;padding:14px 10px;text-align:center;}
.sum-val{font-size:1.5rem;font-weight:800;line-height:1;}
.sum-lbl{font-size:0.62rem;color:var(--muted);font-weight:600;margin-top:3px;text-transform:uppercase;letter-spacing:0.4px;}
.chart-card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;}
.chart-title{font-size:0.75rem;font-weight:700;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:14px;}
.chart-wrap{position:relative;height:200px;}
.salary-card{background:var(--surface);border:1px solid var(--purple);border-radius:16px;padding:16px;margin-bottom:12px;}
.salary-title{font-size:0.72rem;font-weight:700;color:var(--purple);letter-spacing:0.8px;text-transform:uppercase;margin-bottom:8px;}
.salary-total{font-size:2rem;font-weight:800;color:var(--purple);line-height:1;margin-bottom:4px;}
.salary-sub{font-size:0.78rem;color:var(--muted);}
.student-stat-card{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:10px;}
.sstat-name{font-size:1rem;font-weight:700;margin-bottom:10px;}
.sstat-row{display:flex;justify-content:space-between;margin-bottom:6px;}
.sstat-lbl{font-size:0.8rem;color:var(--muted);}
.sstat-val{font-size:0.9rem;font-weight:700;}
.sstat-div{height:1px;background:var(--border);margin:10px 0;}
.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:3px;transition:width 0.6s ease;}

/* CONFIRM */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.confirm-overlay.open{opacity:1;pointer-events:all;}
.confirm-box{background:var(--surface);border-radius:20px;padding:24px 20px;width:100%;max-width:320px;text-align:center;transform:scale(0.9);transition:transform 0.2s;}
.confirm-overlay.open .confirm-box{transform:scale(1);}
.cf-icon{font-size:2.5rem;margin-bottom:10px;}
.cf-title{font-size:1.1rem;font-weight:700;margin-bottom:6px;}
.cf-sub{font-size:0.85rem;color:var(--muted);margin-bottom:20px;line-height:1.4;}
.cf-btns{display:flex;flex-wrap:wrap;gap:8px;}
.cbtn{flex:1;min-width:80px;padding:12px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;}
.cbtn-yes{background:var(--green);color:#000;}
.cbtn-no{background:var(--surface2);color:var(--text);}
.cbtn-skip{background:rgba(255,69,58,0.15);color:var(--red);}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.22s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{width:100%;background:#1c1c1e;border-radius:20px 20px 0 0;padding:18px 20px 44px;transform:translateY(100%);transition:transform 0.28s cubic-bezier(.4,0,.2,1);max-height:90vh;overflow-y:auto;}
.overlay.open .modal{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 18px;}
.modal-title{font-size:1.1rem;font-weight:700;margin-bottom:16px;}
.field{margin-bottom:11px;}
.field label{display:block;font-size:0.72rem;color:var(--muted);font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;}
.field input,.field select{width:100%;background:var(--surface2);border:none;border-radius:10px;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;padding:12px 14px;outline:none;-webkit-appearance:none;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.rem-row{display:flex;gap:8px;margin-bottom:14px;}
.rem-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:transparent;color:var(--muted);font-family:'Nunito',sans-serif;font-size:0.82rem;font-weight:600;cursor:pointer;transition:all 0.18s;}
.rem-btn.active{border-color:var(--orange);color:var(--orange);background:rgba(255,159,10,0.08);}
.price-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:4px 14px 4px 4px;margin-bottom:14px;}
.price-row input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Nunito',sans-serif;font-size:1rem;padding:10px;outline:none;}
.price-row span{font-size:0.85rem;color:var(--muted);font-weight:600;}
.save-btn{width:100%;padding:14px;background:var(--orange);color:#000;border:none;border-radius:13px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:700;cursor:pointer;margin-top:6px;}
.alt-section{background:var(--surface2);border-radius:12px;padding:14px;margin-bottom:14px;}
.alt-title{font-size:0.75rem;font-weight:700;color:var(--orange);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px;}

@keyframes slideDown{from{top:-80px;opacity:0}to{top:20px;opacity:1}}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">Darslar</div>
  <div class="header-right">
    <div class="clock" id="clk"></div>
    <button class="sound-btn" onclick="switchTab('sound')" title="Ovoz sozlamalari">🔔</button>
    <button class="add-btn" onclick="openModal()">+</button>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-tab active" id="tabJ" onclick="switchTab('jadval')">Jadval</button>
  <button class="nav-tab" id="tabS" onclick="switchTab('stat')">Statistika</button>
  <button class="nav-tab" id="tabSnd" onclick="switchTab('sound')">🔔 Ovoz</button>
</div>

<div id="pageJ">
  <div class="day-tabs" id="dayTabs"></div>
  <div id="content"></div>
</div>

<div id="pageS" style="display:none">
  <div class="stats-page">
    <div class="month-selector">
      <button class="month-nav" onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button class="month-nav" onclick="changeMonth(1)">›</button>

</div>

<div id="pageSnd" style="display:none">
  <div class="sound-page">

    <div class="sound-list" id="soundList"></div>
    <div class="vol-section">
      <div class="vol-title">🔊 Ovoz balandligi</div>
      <div class="vol-row">
        <span class="vol-icon">🔈</span>
        <input type="range" id="volRange" min="0" max="1" step="0.1" value="0.7" oninput="updateVol(this)">
        <span class="vol-icon">🔊</span>
        <span class="vol-val" id="volVal">70%</span>
      </div>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="cfOverlay">
  <div class="confirm-box">
    <div class="cf-icon" id="cfIcon"></div>
    <div class="cf-title" id="cfTitle"></div>
    <div class="cf-sub" id="cfSub"></div>
    <div class="cf-btns" id="cfBtns"></div>
  </div>
</div>

<div class="overlay" id="overlay" onclick="bgClose(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">Yangi shogird</div>
    <div class="field">
      <label>Shogird ismi</label>
      <input type="text" id="fName" placeholder="Ismi">
    </div>
    <div class="two-col">
      <div class="field"><label>Kun 1</label>
        <select id="fDay1"><option value="">—</option><option value="0">Dushanba</option><option value="1">Seshanba</option><option value="2">Chorshanba</option><option value="3">Payshanba</option><option value="4">Juma</option><option value="5">Shanba</option><option value="6">Yakshanba</option></select>
      </div>
      <div class="field"><label>Vaqt 1</label><input type="time" id="fTime1" value="09:00"></div>

    <div class="two-col">
      <div class="field"><label>Kun 2</label>
        <select id="fDay2"><option value="">—</option><option value="0">Dushanba</option><option value="1">Seshanba</option><option value="2">Chorshanba</option><option value="3">Payshanba</option><option value="4">Juma</option><option value="5">Shanba</option><option value="6">Yakshanba</option></select>
      </div>
      <div class="field"><label>Vaqt 2</label><input type="time" id="fTime2" value="11:00"></div>
    </div>
    <div class="two-col">
      <div class="field"><label>Kun 3</label>
        <select id="fDay3"><option value="">—</option><option value="0">Dushanba</option><option value="1">Seshanba</option><option value="2">Chorshanba</option><option value="3">Payshanba</option><option value="4">Juma</option><option value="5">Shanba</option><option value="6">Yakshanba</option></select>
      </div>
      <div class="field"><label>Vaqt 3</label><input type="time" id="fTime3" value="14:00"></div>
    </div>
    <div class="alt-section">
      <div class="alt-title">🔄 Galma-gal jadval (ixtiyoriy)</div>
      <div style="font-size:0.78rem;color:var(--muted);margin-bottom:10px;">Toq haftalarda boshqa vaqt bo'lsa</div>
      <div class="two-col">
        <div class="field"><label>Toq hafta kuni</label>
          <select id="fAltDay"><option value="">—</option><option value="0">Dushanba</option><option value="1">Seshanba</option><option value="2">Chorshanba</option><option value="3">Payshanba</option><option value="4">Juma</option><option value="5">Shanba</option><option value="6">Yakshanba</option></select>

      </div>

    <div class="field"><label>Eslatma</label></div>
    <div class="rem-row">
      <button class="rem-btn active" data-v="5" onclick="pickRem(this)">5 daq oldin</button>
      <button class="rem-btn" data-v="10" onclick="pickRem(this)">10 daq oldin</button>
    </div>
    <div class="field"><label>Dars narxi</label></div>
    <div class="price-row">
      <input type="number" id="fPrice" placeholder="0">
      <span>so'm / dars</span>
    </div>
    <button class="save-btn" id="saveBtn" onclick="saveStudent()">Qo'shish</button>
  </div>
</div>

<script>
const DAYS=['Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba','Yakshanba'];
const DS=['Du','Se','Ch','Pa','Ju','Sh','Ya'];
const MONTHS=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];

let students=JSON.parse(localStorage.getItem('dars7')||'[]');
let selDay=todayIdx();
let remMin=5;
let noted=new Set(JSON.parse(sessionStorage.getItem('dars7n')||'[]'));
let curTab='jadval';
let statMonth=new Date().getMonth();
let statYear=new Date().getFullYear();
let editingId=null;
let charts={};
let audioCtx=null;
let selectedSound=localStorage.getItem('dars7_sound')||'bell';
let soundVol=parseFloat(localStorage.getItem('dars7_vol')||'0.7');

// SOUND DEFINITIONS
const SOUNDS={
  bell:{icon:'🔔',name:'Qo\'ng\'iroq',desc:'Klassik qo\'ng\'iroq ovozi'},
  chime:{icon:'🎵',name:'Chime',desc:'Yumshoq melodiya'},
  beep:{icon:'📳',name:'Beep',desc:'Oddiy signal'},
  ding:{icon:'✨',name:'Ding',desc:'Yumshoq ding'},
  alert:{icon:'🚨',name:'Alert',desc:'E\'tibor tortuvchi signal'},
  soft:{icon:'🌙',name:'Yumshoq',desc:'Sokin, yumshoq ovoz'},
};

function getAudioCtx(){
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type,vol){
  try{
    const ctx=getAudioCtx();
    const v=vol!==undefined?vol:soundVol;

    const gain=ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(v,ctx.currentTime);

    const sounds={
      bell:()=>{
        [523.25,659.25,783.99].forEach((f,i)=>{
          const o=ctx.createOscillator();
          o.connect(gain);
          o.type='sine';
          o.frequency.setValueAtTime(f,ctx.currentTime+i*0.15);
          o.start(ctx.currentTime+i*0.15);
          o.stop(ctx.currentTime+i*0.15+0.4);
        });
      },
      chime:()=>{
        [523,784,1047,784,523].forEach((f,i)=>{
          const o=ctx.createOscillator();
          const g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(v*0.6,ctx.currentTime+i*0.12);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.12+0.3);
          o.start(ctx.currentTime+i*0.12);
          o.stop(ctx.currentTime+i*0.12+0.35);
        });
      },
      beep:()=>{
        [800,800,800].forEach((_,i)=>{
          const o=ctx.createOscillator();
          const g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.type='square';o.frequency.value=800;
          g.gain.setValueAtTime(v*0.3,ctx.currentTime+i*0.25);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.25+0.15);
          o.start(ctx.currentTime+i*0.25);
          o.stop(ctx.currentTime+i*0.25+0.18);
        });
      },
      ding:()=>{
        const o=ctx.createOscillator();
        const g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';o.frequency.setValueAtTime(1047,ctx.currentTime);
        o.frequency.exponentialRampToValueAtTime(800,ctx.currentTime+0.5);
        g.gain.setValueAtTime(v,ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+1.2);
        o.start(ctx.currentTime);o.stop(ctx.currentTime+1.3);
      },
      alert:()=>{
        [400,600,400,600].forEach((f,i)=>{
          const o=ctx.createOscillator();
          const g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.type='sawtooth';o.frequency.value=f;
          g.gain.setValueAtTime(v*0.4,ctx.currentTime+i*0.15);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.15+0.12);
          o.start(ctx.currentTime+i*0.15);
          o.stop(ctx.currentTime+i*0.15+0.14);
        });
      },
      soft:()=>{
        [392,494,587].forEach((f,i)=>{
          const o=ctx.createOscillator();
          const g=ctx.createGain();
          o.connect(g);g.connect(ctx.destination);
          o.type='sine';o.frequency.value=f;
          g.gain.setValueAtTime(0,ctx.currentTime+i*0.2);
          g.gain.linearRampToValueAtTime(v*0.4,ctx.currentTime+i*0.2+0.1);
          g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+i*0.2+0.6);
          o.start(ctx.currentTime+i*0.2);
          o.stop(ctx.currentTime+i*0.2+0.65);
        });
      }
    };
    if(sounds[type])sounds[type]();
  }catch(e){console.log('Audio error:',e);}
}

function persist(){localStorage.setItem('dars7',JSON.stringify(students));}
function todayIdx(){const d=new Date().getDay();return d===0?6:d-1;}
function nowMin(){const n=new Date();return n.getHours()*60+n.getMinutes();}
function toMin(t){const[h,m]=t.split(':').map(Number);return h*60+m;}
function todayKey(){const n=new Date();return`${n.getFullYear()}-${n.getMonth()+1}-${n.getDate()}`;}
function getWeekNumber(date){
  const d=new Date(date);d.setHours(0,0,0,0);
  d.setDate(d.getDate()+4-(d.getDay()||7));
  const y=new Date(d.getFullYear(),0,1);
  return Math.ceil((((d-y)/86400000)+1)/7);
}
function isOddWeek(){return getWeekNumber(new Date())%2===1;}

function getEffectiveSchedule(student){
  const schedule=student.schedule||[];
  const alt=student.altSchedule;
  if(!alt||alt.day==='')return schedule;
  if(isOddWeek()){
    const result=[...schedule];
    if(result.length>0)result[0]={day:+alt.day,time:alt.time};
    return result;
  }
  return schedule;
}

function pickRem(btn){
  document.querySelectorAll('.rem-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');remMin=+btn.dataset.v;
}

function openModal(id){
  editingId=id||null;
  document.getElementById('modalTitle').textContent=id?'Tahrirlash':'Yangi shogird';
  document.getElementById('saveBtn').textContent=id?'Saqlash':"Qo'shish";
  if(id){
    const s=students.find(x=>x.id===id);if(!s)return;
    document.getElementById('fName').value=s.name;
    document.getElementById('fPrice').value=s.price||'';
    remMin=s.rem||5;
    document.querySelectorAll('.rem-btn').forEach(b=>b.classList.toggle('active',+b.dataset.v===remMin));
    for(let i=1;i<=3;i++){
      const sc=s.schedule[i-1];
      document.getElementById(`fDay${i}`).value=sc?sc.day:'';
      document.getElementById(`fTime${i}`).value=sc?sc.time:'09:00';
    }
    if(s.altSchedule&&s.altSchedule.day!==''){
      document.getElementById('fAltDay').value=s.altSchedule.day;
      document.getElementById('fAltTime').value=s.altSchedule.time;
    }else{document.getElementById('fAltDay').value='';document.getElementById('fAltTime').value='20:00';}
  }else{
    document.getElementById('fName').value='';
    document.getElementById('fPrice').value='';
    for(let i=1;i<=3;i++){document.getElementById(`fDay${i}`).value='';document.getElementById(`fTime${i}`).value=i===1?'09:00':i===2?'11:00':'14:00';}
    document.getElementById('fAltDay').value='';document.getElementById('fAltTime').value='20:00';
    remMin=5;document.querySelectorAll('.rem-btn').forEach((b,i)=>b.classList.toggle('active',i===0));
  }
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){document.getElementById('overlay').classList.remove('open');editingId=null;}
function bgClose(e){if(e.target===document.getElementById('overlay'))closeModal();}

function saveStudent(){
  const name=document.getElementById('fName').value.trim();if(!name)return;
  const schedule=[];
  for(let i=1;i<=3;i++){
    const day=document.getElementById(`fDay${i}`).value;
    const time=document.getElementById(`fTime${i}`).value;
    if(day!=='')schedule.push({day:+day,time});
  }
  if(!schedule.length){alert("Kamida 1 ta dars kuni!");return;}
  const price=+document.getElementById('fPrice').value||0;
  const altDay=document.getElementById('fAltDay').value;
  const altTime=document.getElementById('fAltTime').value;
  const altSchedule=altDay!==''?{day:altDay,time:altTime}:{day:'',time:''};
  if(editingId){
    const s=students.find(x=>x.id===editingId);
    if(s){s.name=name;s.schedule=schedule;s.rem=remMin;s.price=price;s.altSchedule=altSchedule;}
  }else{
    students.push({id:Date.now(),name,schedule,rem:remMin,price,altSchedule,history:[]});
  }
  persist();closeModal();render();
}

function deleteStudent(id){
  showConfirm('🗑️',"O'chirish","Barcha ma'lumotlar o'chib ketadi!",[
    {label:"O'chirish",cls:'cbtn-skip',fn:()=>{students=students.filter(s=>s.id!==id);persist();render();}}
  ]);
}

function getLessonsForDay(dayIdx){
  const res=[];
  students.forEach(s=>{
    getEffectiveSchedule(s).forEach(sc=>{
      if(sc.day===dayIdx)res.push({student:s,time:sc.time});
    });
  });
  return res.sort((a,b)=>a.time.localeCompare(b.time));
}

function getTodayStatus(student,time){
  const h=student.history.find(x=>x.date===todayKey()&&x.time===time);
  return h?h.status:null;
}

function setHistory(sid,time,status){
  const s=students.find(x=>x.id===sid);if(!s)return;
  const key=todayKey();
  const idx=s.history.findIndex(x=>x.date===key&&x.time===time);
  if(idx>=0)s.history[idx].status=status;
  else s.history.push({date:key,time,status});
  persist();render();
}

function toggleLesson(sid,time,cur){
  const s=students.find(x=>x.id===sid);if(!s)return;
  if(cur==='done'||cur==='skipped'){
    showConfirm('↺','Qaytarish','O\'tilmagan deb belgilash?',[
      {label:'Ha',cls:'cbtn-yes',fn:()=>{
        s.history=s.history.filter(x=>!(x.date===todayKey()&&x.time===time));
        persist();render();
      }}
    ]);
  }else{
    showConfirm('📚',s.name,`${time} — dars holati?`,[
      {label:"✓ O'tildi",cls:'cbtn-yes',fn:()=>setHistory(sid,time,'done')},
      {label:"✗ Qoldirildi",cls:'cbtn-skip',fn:()=>setHistory(sid,time,'skipped')}
    ]);
  }
}

function renderContent(){
  const el=document.getElementById('content');
  const today=todayIdx();const now=nowMin();
  const items=getLessonsForDay(selDay);
  const oddWeek=isOddWeek();
  if(!items.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-icon">📭</div><div style="color:var(--muted);font-size:0.9rem">${DAYS[selDay]} uchun dars yo'q</div></div>`;
    return;
  }
  el.innerHTML='';
  const active=items.filter(x=>!getTodayStatus(x.student,x.time));
  const done=items.filter(x=>getTodayStatus(x.student,x.time)==='done');
  const skipped=items.filter(x=>getTodayStatus(x.student,x.time)==='skipped');

  function group(arr,lbl){
    if(!arr.length)return;
    el.appendChild(Object.assign(document.createElement('div'),{innerHTML:`<div class="sec-label">${lbl}</div>`}));
    const list=document.createElement('div');list.className='lesson-list';
    arr.forEach(({student,time})=>{
      const status=getTodayStatus(student,time);
      const diff=toMin(time)-now;
      const isSoon=selDay===today&&!status&&diff<=(student.rem||5)&&diff>=0;
      let sub='',subC='';
      if(selDay===today&&!status){
        if(isSoon){sub=diff===0?'Hozir!':`${diff} daqiqada`;subC='sc';}
        else if(diff>0&&diff<120){sub=`${diff} daqiqadan keyin`;}
      }
      const isDone=status==='done',isSkip=status==='skipped';
      const cnt=student.history.filter(h=>h.status==='done').length;
      const hasAlt=student.altSchedule&&student.altSchedule.day!=='';
      const isAltWeek=hasAlt&&oddWeek&&selDay===+student.altSchedule.day&&time===student.altSchedule.time;
      const row=document.createElement('div');
      row.className=`lesson-row${isDone?' done':''}${isSkip?' skipped':''}${isSoon?' soon':''}`;
      let pt;
      row.addEventListener('touchstart',()=>{pt=setTimeout(()=>row.classList.add('show-del'),600);});
      row.addEventListener('touchend',()=>clearTimeout(pt));
      row.addEventListener('mouseleave',()=>row.classList.remove('show-del'));
      row.innerHTML=`
        <div class="lesson-time">${time}</div>
        <div class="lesson-info">
          <div class="lesson-name">${student.name}${isAltWeek?'<span class="week-badge">Toq</span>':hasAlt?'<span class="week-badge" style="background:rgba(48,209,88,0.12);color:var(--green)">Juft</span>':''}</div>
          ${sub?`<div class="lesson-sub ${subC}">${sub}</div>`:isDone?`<div class="lesson-sub" style="color:var(--green)">✓ O'tildi • ${cnt} ta</div>`:isSkip?`<div class="lesson-sub" style="color:var(--red)">✗ Qoldirildi</div>`:''}
        </div>
        <div class="row-actions">
          <div class="toggle-wrap">
            <button class="toggle ${isDone?'on':''}" onclick="toggleLesson(${student.id},'${time}','${status||''}')"><div class="toggle-knob"></div></button>
            <div class="toggle-lbl">${isDone?"O'tildi":isSkip?"Qoldi":"O'tilmadi"}</div>
          </div>
          <button class="edit-btn" onclick="openModal(${student.id})">✎</button>
          <button class="del-btn" onclick="deleteStudent(${student.id})">✕</button>
        </div>`;
      list.appendChild(row);
    });
    el.appendChild(list);
  }
  group(active,selDay===today?`BUGUN — ${oddWeek?'Toq':'Juft'} hafta`:DAYS[selDay].toUpperCase());
  group(done,"O'TILGAN");group(skipped,"QOLDIRILGAN");
}

function changeMonth(dir){
  statMonth+=dir;
  if(statMonth<0){statMonth=11;statYear--;}
  if(statMonth>11){statMonth=0;statYear++;}
  renderStats();
}

function destroyCharts(){Object.values(charts).forEach(c=>{try{c.destroy();}catch(e){}});charts={};}

function renderStats(){
  destroyCharts();
  document.getElementById('monthLabel').textContent=`${MONTHS[statMonth]} ${statYear}`;
  const el=document.getElementById('statsContent');
  if(!students.length){el.innerHTML=`<div class="empty-state"><div class="empty-icon">📊</div><div style="color:var(--muted)">Hali shogird yo'q</div></div>`;return;}
  el.innerHTML='';
  const daysInMonth=new Date(statYear,statMonth+1,0).getDate();
  const nowD=new Date();
  const upTo=statYear===nowD.getFullYear()&&statMonth===nowD.getMonth()?nowD.getDate():daysInMonth;
  let totalDone=0,totalSkipped=0,totalEarned=0;
  const monthlyDone=new Array(daysInMonth).fill(0);
  students.forEach(s=>{
    const mh=s.history.filter(h=>{const[y,m]=h.date.split('-').map(Number);return y===statYear&&m===statMonth+1;});
    mh.forEach(h=>{
      if(h.status==='done'){totalDone++;const day=+h.date.split('-')[2];if(day>=1&&day<=daysInMonth)monthlyDone[day-1]++;}
      if(h.status==='skipped')totalSkipped++;
    });
    totalEarned+=mh.filter(h=>h.status==='done').length*(s.price||0);
  });

  const sumRow=document.createElement('div');sumRow.className='summary-row';
  sumRow.innerHTML=`<div class="sum-card"><div class="sum-val" style="color:var(--green)">${totalDone}</div><div class="sum-lbl">O'tildi</div></div><div class="sum-card"><div class="sum-val" style="color:var(--red)">${totalSkipped}</div><div class="sum-lbl">Qoldirildi</div></div><div class="sum-card"><div class="sum-val" style="color:var(--purple)">${students.length}</div><div class="sum-lbl">Shogird</div></div>`;
  el.appendChild(sumRow);

  if(totalEarned>0){
    const sal=document.createElement('div');sal.className='salary-card';
    sal.innerHTML=`<div class="salary-title">💰 ${MONTHS[statMonth]} — Oylik maosh</div><div class="salary-total">${totalEarned.toLocaleString()} so'm</div><div class="salary-sub">${totalDone} ta dars o'tildi • ${totalSkipped} ta qoldirildi</div>`;
    el.appendChild(sal);
  }

  // Line chart
  const lc=document.createElement('div');lc.className='chart-card';
  lc.innerHTML=`<div class="chart-title">📈 Oylik dinamika</div><div class="chart-wrap"><canvas id="lChart"></canvas></div>`;
  el.appendChild(lc);
  setTimeout(()=>{
    const ctx=document.getElementById('lChart');if(!ctx)return;
    const labels=[],cumData=[];let cum=0;
    for(let i=0;i<upTo;i++){labels.push(`${i+1}`);cum+=monthlyDone[i];cumData.push(cum);}
    charts.line=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:"O'tilgan",data:cumData,borderColor:'#30d158',backgroundColor:'rgba(48,209,88,0.1)',fill:true,tension:0.4,pointRadius:2,borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#8e8e93',font:{size:10}},grid:{color:'#38383a'}},y:{ticks:{color:'#8e8e93',font:{size:10}},grid:{color:'#38383a'},beginAtZero:true}}}});
  },100);

  // Bar chart
  const bc=document.createElement('div');bc.className='chart-card';
  bc.innerHTML=`<div class="chart-title">📊 Shogirdlar faolligi</div><div class="chart-wrap"><canvas id="bChart"></canvas></div>`;
  el.appendChild(bc);
  setTimeout(()=>{
    const ctx=document.getElementById('bChart');if(!ctx)return;
    const names=students.map(s=>s.name.split(' ')[0]);
    const dc=students.map(s=>s.history.filter(h=>{const[y,m]=h.date.split('-').map(Number);return y===statYear&&m===statMonth+1&&h.status==='done';}).length);
    const sc=students.map(s=>s.history.filter(h=>{const[y,m]=h.date.split('-').map(Number);return y===statYear&&m===statMonth+1&&h.status==='skipped';}).length);
    charts.bar=new Chart(ctx,{type:'bar',data:{labels:names,datasets:[{label:"O'tildi",data:dc,backgroundColor:'rgba(48,209,88,0.7)',borderRadius:6},{label:'Qoldirildi',data:sc,backgroundColor:'rgba(255,69,58,0.5)',borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8e8e93',font:{size:10}}}},scales:{x:{ticks:{color:'#8e8e93',font:{size:10}},grid:{display:false}},y:{ticks:{color:'#8e8e93',font:{size:10}},grid:{color:'#38383a'},beginAtZero:true}}}});
  },200);

  // Donut
  if(totalDone+totalSkipped>0){
    const dc2=document.createElement('div');dc2.className='chart-card';
    dc2.innerHTML=`<div class="chart-title">🍩 Nisbat</div><div class="chart-wrap" style="height:160px"><canvas id="dChart"></canvas></div>`;
    el.appendChild(dc2);
    setTimeout(()=>{
      const ctx=document.getElementById('dChart');if(!ctx)return;
      charts.donut=new Chart(ctx,{type:'doughnut',data:{labels:["O'tildi",'Qoldirildi'],datasets:[{data:[totalDone,totalSkipped],backgroundColor:['rgba(48,209,88,0.8)','rgba(255,69,58,0.6)'],borderColor:['#1c1c1e'],borderWidth:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8e8e93',font:{size:11}}}}}});
    },300);
  }

  students.forEach(s=>{
    const mh=s.history.filter(h=>{const[y,m]=h.date.split('-').map(Number);return y===statYear&&m===statMonth+1;});
    const done=mh.filter(h=>h.status==='done').length;
    const skipped=mh.filter(h=>h.status==='skipped').length;
    const earned=done*(s.price||0);
    let planned=0;
    for(let d=1;d<=upTo;d++){
      const date=new Date(statYear,statMonth,d);
      const di=date.getDay()===0?6:date.getDay()-1;
      s.schedule.forEach(sc=>{if(sc.day===di)planned++;});
    }
    const pct=planned>0?Math.round(done/planned*100):0;
    const card=document.createElement('div');card.className='student-stat-card';
    card.innerHTML=`<div class="sstat-name">${s.name}</div><div class="sstat-row"><span class="sstat-lbl">O'tilgan</span><span class="sstat-val" style="color:var(--green)">${done} ta</span></div><div class="sstat-row"><span class="sstat-lbl">Qoldirilgan</span><span class="sstat-val" style="color:var(--red)">${skipped} ta</span></div><div class="sstat-row"><span class="sstat-lbl">Davomat</span><span class="sstat-val" style="color:var(--orange)">${pct}%</span></div><div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct>=80?'var(--green)':pct>=50?'var(--orange)':'var(--red)'}"></div></div>${s.price?`<div class="sstat-div"></div><div class="sstat-row"><span class="sstat-lbl">To'lov</span><span class="sstat-val" style="color:var(--purple)">${earned.toLocaleString()} so'm</span></div>`:''}`;
    el.appendChild(card);
  });
}

function checkReminders(){
  const today=todayIdx();const now=nowMin();
  students.forEach(s=>{
    getEffectiveSchedule(s).filter(sc=>sc.day===today).forEach(sc=>{
      const diff=toMin(sc.time)-now;
      const status=getTodayStatus(s,sc.time);
      const bk=`b_${s.id}_${sc.time}_${todayKey()}`;
      if(diff<=(s.rem||5)&&diff>=0&&!noted.has(bk)&&!status){
        noted.add(bk);sessionStorage.setItem('dars7n',JSON.stringify([...noted]));
        playSound(selectedSound);
        showBanner(s.name,sc.time,diff);
        if('Notification'in window&&Notification.permission==='granted')
          new Notification('⏰ Dars eslatmasi',{body:`${s.name} — ${sc.time}`});
      }
      const ak=`a_${s.id}_${sc.time}_${todayKey()}`;
      if(diff<=-45&&diff>=-90&&!noted.has(ak)&&!status){
        noted.add(ak);sessionStorage.setItem('dars7n',JSON.stringify([...noted]));
        playSound('ding');
        showConfirm('📚',s.name,`${sc.time} — dars o'tdimi?`,[
          {label:"✓ O'tildi",cls:'cbtn-yes',fn:()=>setHistory(s.id,sc.time,'done')},
          {label:"✗ Qoldirildi",cls:'cbtn-skip',fn:()=>setHistory(s.id,sc.time,'skipped')}
        ]);
      }
    });
  });
}

function showBanner(name,time,diff){
  const b=document.createElement('div');
  b.style.cssText=`position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#1c1c1e;border:1px solid #38383a;border-left:3px solid #ff9f0a;border-radius:14px;padding:13px 18px;z-index:150;min-width:250px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,0.6);animation:slideDown .3s ease;font-family:'Nunito',sans-serif;`;
  b.innerHTML=`<div style="font-size:.7rem;color:#ff9f0a;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px">⏰ Dars eslatmasi</div><div style="font-size:.98rem;font-weight:700">${name}</div><div style="font-size:.8rem;color:#8e8e93;margin-top:2px">${time} — ${diff===0?'Hozir!':diff+' daqiqada'}</div>`;
  document.body.appendChild(b);
  setTimeout(()=>b.remove(),7000);
}
